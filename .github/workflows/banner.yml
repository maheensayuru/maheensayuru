name: Rebuild Profile Banner

on:
  push:
    paths:
      - asciifetch.toml
      - headshot.jpg
      - generate_banner.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/ganji759/asciifetch.git
          pip install opencv-python-headless pillow numpy

      - name: Rebuild custom banner
        run: |
          python generate_banner.py

      - name: Commit updated banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fastfetch.svg fastfetch.png fastfetch.txt avatar.jpg avatar-ascii.png
          git diff --staged --quiet || git commit -m "chore: rebuild frameless B&W asciifetch banner"
          git push
