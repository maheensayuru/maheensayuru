name: Rebuild Profile Card

on:
  push:
    paths:
      - headshot.jpg
      - build_andrew_profile.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy opencv-python-headless

      - name: Rebuild Andrew6rant style SVG cards
        run: |
          python build_andrew_profile.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || git commit -m "chore: rebuild Andrew6rant profile SVGs"
          git push
